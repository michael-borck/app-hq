    stack: electron
    notes: "Cookiecutter wrapper around the same stack, with Docker containerisation; checked out under books/ship-support/."
  - repo: michael-borck/ship-python-example
    stack: electron
    notes: "Example of the same stack built into web, PWA and Electron; checked out under books/ship-support/."
